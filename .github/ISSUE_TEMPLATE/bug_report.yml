name: Bug report
description: Something in MeowPlayer is not working right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
  - type: input
    id: version
    attributes:
      label: MeowPlayer version
      description: Shown in Settings → About.
      placeholder: 2.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: textarea
    id: log
    attributes:
      label: Crash log
      description: If something crashed, attach or paste the log from Settings → System → Show crash log.
      render: text
